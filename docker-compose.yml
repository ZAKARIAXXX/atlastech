version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlastech-postgres
    environment:
      POSTGRES_USER: atlastech
      POSTGRES_PASSWORD: atlastech
      POSTGRES_DB: atlastech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlastech"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atlastech-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: atlastech-api
    environment:
      ATLASTECH_DATABASE_URL: postgresql+asyncpg://atlastech:atlastech@postgres:5432/atlastech
      ATLASTECH_REDIS_URL: redis://redis:6379/0
      ATLASTECH_ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api/app:/app/app

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: atlastech-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
