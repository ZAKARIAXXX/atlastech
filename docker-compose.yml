services:
  postgres:
    image: postgres:16-alpine
    container_name: atlastech-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atlastech

  redis:
    image: redis:7-alpine
    container_name: atlastech-redis
    command: redis-server --requirepass ${ATLASTECH_REDIS_PASSWORD:?ATLASTECH_REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${ATLASTECH_REDIS_PASSWORD:?ATLASTECH_REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atlastech

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: atlastech-api
    env_file: .env
    environment:
      ATLASTECH_DATABASE_URL: ${ATLASTECH_DATABASE_URL:?ATLASTECH_DATABASE_URL is required}
      ATLASTECH_REDIS_URL: ${ATLASTECH_REDIS_URL:?ATLASTECH_REDIS_URL is required}
      ATLASTECH_ENVIRONMENT: ${ATLASTECH_ENVIRONMENT:-development}
      ATLASTECH_JWT_SECRET_KEY: ${ATLASTECH_JWT_SECRET_KEY:?ATLASTECH_JWT_SECRET_KEY is required}
      ATLASTECH_API_KEY: ${ATLASTECH_API_KEY:?ATLASTECH_API_KEY is required}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - atlastech

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: atlastech-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - atlastech

volumes:
  postgres_data:
  redis_data:

networks:
  atlastech:
    driver: bridge
